name: CI/CD

on:
 push:
   branches: [ main ]
 pull_request:
   branches: [ main ]

jobs:
 test:
   runs-on: ubuntu-24.04

   steps:
      - uses: actions/checkout@v6

      - name: Build calculator image
        run: docker build -t fastapi-calculator .

      - name: Start calculator and wait for it to respond
        run: |
          docker run -d --name fastapi-calculator \
            -p 127.0.0.1:8000:8000 fastapi-calculator

          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Calculator did not respond on port 8000."
          exit 1

      - name: Run unit, integration, and Playwright tests
        run: docker exec fastapi-calculator python -m pytest tests/ -v

      - name: Show calculator logs on failure
        if: failure()
        run: |
          if docker container inspect fastapi-calculator >/dev/null 2>&1; then
            docker logs fastapi-calculator
          fi
 security:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     
     - name: Build image
       run: docker build -t app:test .
     
     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@master
       with:
         image-ref: 'app:test'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'

 deploy:
   needs: security
   if: github.ref == 'refs/heads/main'
   runs-on: ubuntu-latest
   environment: production
   steps:
     - uses: actions/checkout@v4
     
     - uses: docker/setup-buildx-action@v3
     
     - uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
         
     - uses: docker/build-push-action@v5
       with:
         push: true
         tags: |
           rajaramnpatil/601_module8:latest
           rajaramnpatil/601_module8:${{ github.sha }}
         platforms: linux/amd64,linux/arm64
         cache-from: type=registry,ref=rajaramnpatil/601_module8:cache
         cache-to: type=inline,mode=max
