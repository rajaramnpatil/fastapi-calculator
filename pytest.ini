[pytest]
# Look in tests/ when no test path is specified.
testpaths = tests

# Measure coverage for the app package and the FastAPI routes in main.py.
# Show missed lines in the terminal and save an HTML report in htmlcov/.
addopts = --cov=app --cov=main --cov-report=term-missing --cov-report=html

# Discover test files, classes, and functions using these naming patterns.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Register markers for tests that explicitly use them.
markers =
    slow: marks slower tests
    fast: marks faster tests
    e2e: marks end-to-end browser tests

# Suppress these warning categories during test runs.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning